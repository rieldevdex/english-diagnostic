<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Diagnostic Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: an exam booklet — one narrow column of numbered questions on a sheet; the teacher report widens into a scannable diagnostic. */
:root {
  --paper: #EEF0EB;
  --sheet: #FFFFFF;
  --ink: #17202B;
  --muted: #5A6470;
  --rule: #D8DCD3;
  --accent: #2443C4;
  --accent-soft: #E7ECFC;
  --mark: #FFE36E;
  --good: #23784D; --good-soft: #E1F2E8;
  --warn: #9A6500; --warn-soft: #FBEFD3;
  --bad: #B3302F; --bad-soft: #FBE3E1;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101419; --sheet: #182029; --ink: #E6E9ED; --muted: #9AA4AF; --rule: #2B3542;
    --accent: #8FA6FF; --accent-soft: #212B48; --mark: #5E4F12;
    --good: #63C892; --good-soft: #17301F; --warn: #E6B54A; --warn-soft: #33290F; --bad: #F08482; --bad-soft: #3A1B1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101419; --sheet: #182029; --ink: #E6E9ED; --muted: #9AA4AF; --rule: #2B3542;
  --accent: #8FA6FF; --accent-soft: #212B48; --mark: #5E4F12;
  --good: #63C892; --good-soft: #17301F; --warn: #E6B54A; --warn-soft: #33290F; --bad: #F08482; --bad-soft: #3A1B1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 2.3rem; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 80px; display: flex; flex-direction: column; gap: 22px; }
.wrap.wide { max-width: 1120px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.btn { appearance: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
input[type=text], textarea { width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
textarea { resize: vertical; line-height: 1.6; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 6px; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; padding: 10px 0 4px; }
.hero p { max-width: 60ch; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 0.92rem; }
.card .grow { flex: 1; }

/* Test */
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.topbar .inner { max-width: 1120px; margin: 0 auto; padding: 10px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--rule); background: var(--sheet); border-radius: 7px; padding: 5px 10px; font-size: 0.84rem; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.tab[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tab .cnt { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.timer { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer.over { color: var(--warn); }
.items { display: flex; flex-direction: column; gap: 0; }
.item { padding: 18px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 80px; }
.item:first-child { border-top: 0; padding-top: 4px; }
.qhead { display: flex; gap: 12px; align-items: baseline; }
.qnum { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); min-width: 2.2em; font-variant-numeric: tabular-nums; }
.qtext { font-size: 1.04rem; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 1.5px solid var(--ink); margin: 0 3px; transform: translateY(-3px); }
.seg { text-decoration: none; border-bottom: 2px solid var(--ink); padding-bottom: 1px; }
.seg sup { font-family: var(--f-mono); font-size: 0.68rem; color: var(--accent); margin-left: 2px; font-weight: 600; }
.opts { display: grid; grid-template-columns: 1fr; gap: 6px; padding-left: calc(2.2em + 12px); }
.opts.inline { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; cursor: pointer; background: var(--sheet); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { font-family: var(--f-mono); font-size: 0.78rem; border: 1px solid var(--rule); border-radius: 5px; width: 1.6em; height: 1.6em; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.gapin { padding-left: calc(2.2em + 12px); max-width: 360px; }
.unsure { padding-left: calc(2.2em + 12px); font-size: 0.82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; width: fit-content; }
.unsure input { accent-color: var(--warn); }
.rblock { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; padding: 8px 0 26px; border-bottom: 1px dashed var(--rule); }
.rblock:last-child { border-bottom: 0; }
.passage { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; font-family: var(--f-display); font-size: 1.08rem; line-height: 1.6; display: flex; flex-direction: column; gap: 12px; }
.passage .ptitle { font-weight: 600; font-size: 1.15rem; }
@media (max-width: 760px) { .topbar .tabs { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; } .tab { flex: none; } .rblock { grid-template-columns: 1fr; } .passage { position: static; max-height: none; } .opts { padding-left: 0; } .unsure, .gapin { padding-left: 0; } }
.player { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
.playbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--sheet); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.playbtn:disabled { background: var(--rule); color: var(--muted); cursor: not-allowed; }
.playbtn svg { width: 18px; height: 18px; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.task-text { font-family: var(--f-display); font-size: 1.1rem; }
.task-text ul { margin: 6px 0 0; padding-left: 22px; }
.wc { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.code { font-family: var(--f-mono); font-size: 0.75rem; word-break: break-all; min-height: 110px; }

/* Teacher */
.tgrid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .tgrid { grid-template-columns: 1fr; } }
.alist { display: flex; flex-direction: column; gap: 6px; }
.aitem { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.aitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.report { display: flex; flex-direction: column; gap: 18px; }
.headline { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.bigl { font-family: var(--f-display); font-size: 3.4rem; line-height: 1; font-weight: 500; color: var(--accent); }
.profile { display: flex; flex-direction: column; gap: 9px; }
.prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: 0.92rem; }
.track { position: relative; height: 18px; background: linear-gradient(90deg, transparent calc(20% - 1px), var(--rule) calc(20% - 1px), var(--rule) 20%, transparent 20%, transparent calc(40% - 1px), var(--rule) calc(40% - 1px), var(--rule) 40%, transparent 40%, transparent calc(60% - 1px), var(--rule) calc(60% - 1px), var(--rule) 60%, transparent 60%, transparent calc(80% - 1px), var(--rule) calc(80% - 1px), var(--rule) 80%, transparent 80%); border-bottom: 1px solid var(--rule); }
.bar { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar.pending { background: repeating-linear-gradient(45deg, var(--rule) 0 4px, transparent 4px 8px); width: 100% !important; border-radius: 0; }
.scale { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); }
.scale .ticks { display: grid; grid-template-columns: repeat(5, 1fr); }
.scale .ticks span { text-align: right; padding-right: 4px; }
.lvl { font-family: var(--f-mono); font-size: 0.85rem; font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; font-family: var(--f-mono); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.tablewrap { overflow-x: auto; }
.mini { position: relative; height: 8px; background: var(--paper); border-radius: 4px; min-width: 80px; }
.mini i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.prio { display: flex; flex-direction: column; gap: 12px; counter-reset: p; }
.prio > div { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.prio > div::before { counter-increment: p; content: counter(p); font-family: var(--f-display); font-size: 1.6rem; color: var(--accent); line-height: 1; }
.cell-good { color: var(--good); } .cell-warn { color: var(--warn); } .cell-bad { color: var(--bad); }
.rub { display: flex; flex-direction: column; gap: 14px; }
.rubrow { display: flex; flex-direction: column; gap: 6px; }
.bands { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.band { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 2px; font-size: 0.75rem; font-family: var(--f-mono); cursor: pointer; text-align: center; }
.band[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; background: var(--sheet); }
.chip[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.essay { white-space: pre-wrap; font-family: var(--f-display); font-size: 1.05rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; max-height: 420px; overflow: auto; }
details > summary { cursor: pointer; font-weight: 500; }
details[open] > summary { margin-bottom: 10px; }
.review td.wrong { background: var(--bad-soft); }
.ai { border: 1px dashed var(--accent); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }
.status { font-size: 0.85rem; }
@media (prefers-reduced-motion: no-preference) { .bar { transition: width 0.4s ease; } }
</style>
</head>

/* ---------- Bank indexes ---------- */
const PART_KEYS = B.PARTS.map(p => p.key);
const ITEMS = PART_KEYS.flatMap(k => B.ITEMS[k]);
const NUM = {}; ITEMS.forEach((it, i) => { NUM[it.id] = i + 1; });
const LVLS = ["A2", "B1", "B2", "C1"];
const LVIDX = { A1: 1, A2: 2, B1: 3, B2: 4, C1: 5 };
const LNAME = { 1: "Below A2", 2: "A2", 3: "B1", 4: "B2", 5: "C1" };
const OBJ_SKILLS = ["G", "V", "R", "L", "RW"];
const KEYS = "ABCDEF";

/* ---------- Helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const fmtTime = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const words = t => (String(t || "").trim().match(/\S+/g) || []).length;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const K_CUR = "eldiag.v1.current", K_LIB = "eldiag.v1.library", K_TEACH = "eldiag.v1.teacher";
const enc = obj => "ELD1." + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
const dec = str => { const s = String(str).trim().replace(/^ELD1\./, ""); return JSON.parse(decodeURIComponent(escape(atob(s)))); };
function blankify(q) { return esc(q).replace(/_{3,}/g, '<span class="blank" aria-label="blank"></span>'); }

/* ---------- Attempt state ---------- */
function newAttempt(name) {
  return {
    v: 1, id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name.trim(), created: new Date().toISOString(),
    s1: { ans: {}, unsure: {}, time: {}, plays: {}, part: 0, done: false, finished: null },
    s2: { text: { W1: "", W2: "" }, time: {}, done: false, finished: null },
    marks: { W: { scores: {}, tags: [], notes: "" }, S: { scores: {}, tags: [], notes: "" } },
  };
}
let A = store.get(K_CUR, null);
let dbStatus = "none"; // none | saving | saved | failed

/* ---------- Capabilities (all optional) ---------- */
const caps = { db: null, user: null, tts: null, sample: null };
let isOwner = false;
async function initCaps() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const get = async n => { try { return await window.claude.use(n); } catch { return null; } };
  const [u, d, t, s] = await Promise.all([get("user"), get("db"), get("tts"), get("sample")]);
  Object.assign(caps, { user: u, db: d, tts: t, sample: s });
  try { isOwner = u ? !!(await u.isOwner()) : false; } catch { isOwner = false; }
  if (caps.db && A) syncDb();
  if (route() === "teacher") { subscribeAttempts(); render(); }
}

let dbTimer = null, dbBusy = false, dbAgain = false;
function syncDb() {
  if (!caps.db || !A) return;
  clearTimeout(dbTimer);
  dbTimer = setTimeout(async () => {
    if (dbBusy) { dbAgain = true; return; }
    dbBusy = true; dbStatus = "saving";
    try { await caps.db.doc("attempts/" + A.id).set(JSON.parse(JSON.stringify(A))); dbStatus = "saved"; }
    catch (e) { dbStatus = "failed"; }
    dbBusy = false; updateSaveStatus();
    if (dbAgain) { dbAgain = false; syncDb(); }
  }, 1500);
}
function save(remote = true) { if (!A) return; store.set(K_CUR, A); if (remote) syncDb(); }
function updateSaveStatus() { const el = $("#savestatus"); if (el) el.innerHTML = saveStatusHTML(); }
function saveStatusHTML() {
  if (dbStatus === "saved") return '<span class="pill good">Saved for your teacher</span>';
  if (dbStatus === "saving") return '<span class="pill">Saving…</span>';
  return '<span class="pill">Saved on this device</span>';
}

/* ---------- Routing ---------- */
function route() { const h = (location.hash || "").replace("#", ""); if (STUDENT && h === "teacher") return "home"; return ["session-1", "session-2", "teacher", "done-1", "done-2"].includes(h) ? h : "home"; }
window.addEventListener("hashchange", () => { stopAudio(); render(); window.scrollTo(0, 0); });
function go(h) { if (location.hash === "#" + h) { render(); window.scrollTo(0, 0); } else location.hash = h; }

/* ---------- Scoring ---------- */
function isCorrect(it, r) {
  if (r === undefined || r === null || r === "") return false;
  if (it.type === "gap") { const n = String(r).toLowerCase().replace(/^mr\.?\s+/, "").replace(/[^a-z]/g, ""); return it.accept.includes(n); }
  return Number(r) === it.ans;
}
function errTag(it, r) {
  if (r === undefined || r === null || r === "") return "UNANSWERED";
  if (isCorrect(it, r)) return null;
  if (it.type === "gap" || it.type === "err") return it.tag;
  if (it.type === "tfng") { const NG = 2; return (it.ans === NG || Number(r) === NG) ? "NG_CONFUSION" : "MISREAD"; }
  return (it.t && it.t[Number(r)]) || "MISREAD";
}
function respText(it, r) {
  if (r === undefined || r === null || r === "") return "—";
  if (it.type === "gap") return String(r);
  return KEYS[Number(r)] + ". " + it.o[Number(r)];
}
function ansText(it) { return it.type === "gap" ? it.accept[0].replace(/^./, c => c.toUpperCase()) : KEYS[it.ans] + ". " + it.o[it.ans]; }

function estimate(lv) {
  let ach = 1, next = null, top = 0;
  for (const L of LVLS) if (lv[L] && lv[L].n) top = LVIDX[L];
  for (const L of LVLS) {
    const x = lv[L]; if (!x || !x.n) continue;
    const p = x.c / x.n;
    if (p >= 0.6) ach = LVIDX[L]; else { next = { L, p }; break; }
  }
  if (!next) return { pos: ach, label: LNAME[ach], ceiling: ach === top && ach < 5 };
  return { pos: ach + Math.min(next.p / 0.6, 1) * 0.85, label: LNAME[ach] + (next.p >= 0.4 && ach > 1 ? "+" : "") };
}
function prodEstimate(scores) {
  const vals = Object.values(scores || {}).filter(v => typeof v === "number");
  if (!vals.length) return null;
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return { pos: Math.max(avg, 0.15), label: B.BANDS[Math.round(avg)].replace("C1+", "C1"), n: vals.length };
}

function analyse(at) {
  const s1 = at.s1 || { ans: {}, unsure: {} };
  const out = { items: [], skill: {}, sub: {}, tags: {}, unanswered: 0, sureWrong: [], unsureRight: [], answered: 0 };
  for (const k of OBJ_SKILLS) out.skill[k] = { n: 0, c: 0, lv: {} };
  for (const it of ITEMS) {
    const r = s1.ans[it.id]; const ok = isCorrect(it, r); const tag = errTag(it, r); const unsure = !!s1.unsure[it.id];
    const answered = !(r === undefined || r === null || r === "");
    if (answered) out.answered++;
    const sk = out.skill[it.part]; sk.n++; if (ok) sk.c++;
    (sk.lv[it.lvl] ||= { n: 0, c: 0 }).n++; if (ok) sk.lv[it.lvl].c++;
    const sb = (out.sub[it.sub] ||= { n: 0, c: 0, sureWrong: 0, unsureRight: 0, wrong: [] }); sb.n++;
    if (ok) { sb.c++; if (unsure) { sb.unsureRight++; out.unsureRight.push(it.id); } }
    else { sb.wrong.push(it.id); if (answered && !unsure) { sb.sureWrong++; out.sureWrong.push(it.id); } }
    if (tag === "UNANSWERED") out.unanswered++;
    else if (tag) { const t = (out.tags[tag] ||= { n: 0, ids: [], src: new Set() }); t.n++; t.ids.push(it.id); t.src.add(B.SKILLS[it.part].name); }
    out.items.push({ it, r, ok, tag, unsure });
  }
  for (const k of OBJ_SKILLS) out.skill[k].est = estimate(out.skill[k].lv);
  for (const k of ["W", "S"]) {
    const m = (at.marks || {})[k] || {};
    out.skill[k] = { est: prodEstimate(m.scores) };
    for (const tg of m.tags || []) { const t = (out.tags[tg] ||= { n: 0, ids: [], src: new Set() }); t.n += 2; t.src.add(B.SKILLS[k].name); }
  }
  // priorities
  const cands = [];
  for (const [sub, x] of Object.entries(out.sub)) if (x.n >= 2) cands.push({ sub, score: x.c / x.n, weak: (1 - x.c / x.n + 0.04 * x.sureWrong) * (sub === "RW-SLG" ? 0.7 : 1), detail: x.c + "/" + x.n + " correct" + (x.sureWrong ? " · " + x.sureWrong + " confident error" + (x.sureWrong > 1 ? "s" : "") : "") });
  for (const k of ["W", "S"]) {
    const sc = ((at.marks || {})[k] || {}).scores || {};
    for (const [sub, v] of Object.entries(sc)) if (typeof v === "number") cands.push({ sub, score: (v - 1) / 4, weak: 1 - (v - 1) / 4, detail: "marked " + B.BANDS[v] });
  }
  cands.sort((a, b) => b.weak - a.weak);
  out.priorities = cands.filter(c => c.score < 0.67).slice(0, 5);
  out.strengths = cands.filter(c => c.score >= 0.8).sort((a, b) => b.score - a.score).slice(0, 4);
  const pos = ["G", "V", "R", "L", "RW", "W", "S"].map(k => out.skill[k].est).filter(Boolean).map(e => e.pos).sort((a, b) => a - b);
  out.overall = pos.length ? pos[Math.floor((pos.length - 1) / 2)] : null;
  return out;
}
function posLabel(p) { if (p == null) return "—"; const base = Math.floor(p + 1e-9); const frac = p - base; return (LNAME[Math.min(base, 5)] || "Below A2") + (frac >= 0.5 && base < 5 && base > 1 ? "+" : ""); }

async function playClip(key) {
  const clip = B.CLIPS[key]; const plays = A.s1.plays[key] || 0;
  if (plays >= 2 || speaking) return;
  A.s1.plays[key] = plays + 1; save(); speaking = key; renderPlayer(key, "Playing…");
  const done = (msg) => { speaking = null; renderPlayer(key, msg); };
  if (caps.tts) {
    try { await caps.tts.speak(clip.lines.map(l => ({ text: l.text, voice: l.v, language: "en" }))); done("Finished"); return; }
    catch (e) { if (e && e.code === "not_granted") caps.tts = null; else { done("Playback stopped"); return; } }
  }
  if (!("speechSynthesis" in window)) { done("This browser can't play audio. Ask your teacher to read the clip aloud."); return; }
  const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pick = { rounded: voices[0], airy: voices[1] || voices[0], glassy: voices[2] || voices[0] };
  const lines = clip.lines.slice();
  const next = () => {
    const l = lines.shift(); if (!l) { done("Finished"); return; }

}

  <details><summary class="small">Import a student's code</summary><div style="display:flex;flex-direction:column;gap:8px"><textarea id="importbox" class="code" placeholder="Paste the ELD1… code here"></textarea><button class="btn small primary" id="doimport">Import</button><span class="small muted" id="importmsg"></span>
  <p class="small muted">Codes from Session 1 and Session 2 merge into one attempt when the name matches.</p></div></details></aside>
  <section id="reportpane"></section></div></main>`;
}
function bindTeacher() { if (!teacherOK && !isOwner) return; subscribeAttempts(); renderTeacherList(); renderReport(); }
function renderTeacherList() {
  const el = $("#alist"); if (!el) return;
  const list = allAttempts();
  if (!sel && list.length) sel = list[0].a.id;
  el.innerHTML = (dbLoadMsg ? `<span class="small muted">${esc(dbLoadMsg)}</span>` : "") + (list.length ? list.map(({ a, src }) => {
    const n = Object.keys(a.s1?.ans || {}).length;
    return `<button class="aitem" data-sel="${esc(a.id)}" aria-current="${a.id === sel}"><b>${esc(a.name)}</b><span class="small muted">${new Date(a.created).toLocaleDateString()} · S1 ${a.s1?.done ? "done" : n + "/" + ITEMS.length} · S2 ${a.s2?.done ? "done" : "—"}</span><span class="small muted">${src === "db" ? "Synced" : "This device"}</span></button>`;
  }).join("") : `<p class="small muted">No attempts yet. When a student finishes on this device, or you import their code, it appears here.</p>`);
}

function renderReport() {
  const pane = $("#reportpane"); if (!pane) return;
  const rec = sel && getAttempt(sel);
  if (!rec) { pane.innerHTML = `<div class="sheet"><h3>No attempt selected</h3><p class="muted">Pick an attempt on the left or import a code.</p></div>`; return; }
  const at = rec.a; at.marks ||= { W: { scores: {}, tags: [], notes: "" }, S: { scores: {}, tags: [], notes: "" } };
  const an = analyse(at);
  const tabs = [["report", "Report"], ["writing", "Mark writing"], ["speaking", "Mark speaking"], ["items", "Answers"]];
  pane.innerHTML = `<div class="report"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" data-rtab="${k}" aria-current="${reportTab === k}">${l}</button>`).join("")}</div>
  ${reportTab === "report" ? reportHTML(at, an) : reportTab === "writing" ? markHTML(at, "W") : reportTab === "speaking" ? markHTML(at, "S") : itemsHTML(at, an)}</div>`;
}

function band(p) { return p >= 0.8 ? "good" : p >= 0.6 ? "warn" : "bad"; }
function reportHTML(at, an) {
  const skillRows = ["G", "V", "R", "L", "RW", "W", "S"].map(k => {
    const e = an.skill[k].est; const name = B.SKILLS[k].name;
    if (!e) return `<div class="prow"><span>${name}</span><div class="track" title="Not marked yet"><div class="bar pending"></div></div><span class="small muted">not marked</span></div>`;
    const sk = an.skill[k];
    const tip = sk.n ? `${name}: ${sk.c}/${sk.n} correct · estimated ${e.label}` : `${name}: rubric average · ${e.label}`;
    return `<div class="prow"><span>${name}</span><div class="track" title="${esc(tip)}"><div class="bar" style="width:${(Math.min(e.pos, 5) / 5 * 100).toFixed(1)}%"></div></div><span class="lvl">${e.label}${e.ceiling ? '<span class="muted small"> max</span>' : ""}</span></div>`;
  }).join("");
  const s1n = an.answered;
  const acad = ["G", "V", "R", "L"].map(k => an.skill[k].est.pos); const acadAvg = acad.reduce((a, b) => a + b, 0) / acad.length;
  const rwPos = an.skill.RW.est.pos; const gap = rwPos - acadAvg;
  const insights = [];
  if (s1n) {
    insights.push(Math.abs(gap) < 0.35 ? `Real-world English is roughly level with her exam English (${posLabel(rwPos)} vs ${posLabel(acadAvg)}).` :
      gap < 0 ? `Real-world English (${posLabel(rwPos)}) is behind her exam English (${posLabel(acadAvg)}). She has learned English as a school subject more than as a living language, so idioms, tone and natural phrasing need deliberate exposure.` :
      `Real-world English (${posLabel(rwPos)}) is ahead of her exam English (${posLabel(acadAvg)}). She picks up English from media, and her accuracy and academic skills need structured work.`);
    if (an.sureWrong.length >= 5) insights.push(`${an.sureWrong.length} wrong answers were given <b>without</b> ticking Not sure. These are misconceptions she believes are correct, so they need re-teaching, not just more practice.`);
    if (an.unsureRight.length >= 5) insights.push(`${an.unsureRight.length} correct answers were marked Not sure. That knowledge is fragile and may not hold under exam pressure.`);
    if (an.unanswered) insights.push(`${an.unanswered} question${an.unanswered > 1 ? "s were" : " was"} left blank and counted as wrong.`);
    const t = at.s1.time || {}; const slow = B.PARTS.filter(p => (t[p.key] || 0) > p.mins * 60 * 1.3).map(p => p.title.replace(/^Part \d+: /, ""));
    if (slow.length) insights.push(`She went well over the suggested time on ${slow.join(", ")}. Speed may be part of the problem there.`);
  }
  const both = Object.entries(an.tags).filter(([k, v]) => v.src.size >= 2 && ([...v.src].some(s => s === "Writing" || s === "Speaking")));
  if (both.length) insights.push(`Confirmed in both test answers and her own writing/speech: <b>${both.map(([k]) => esc(B.ERRTAGS[k]?.label || k)).join(", ")}</b>. These are the most reliable targets.`);

  const prio = an.priorities.length ? an.priorities.map(p => { const s = B.SUBS[p.sub]; return `<div><div><h3>${esc(s.name)} <span class="pill ${p.score < 0.4 ? "bad" : "warn"}">${esc(B.SKILLS[s.skill].name)} · ${esc(p.detail)}</span></h3><p class="muted" style="margin-top:4px">${esc(s.fix)}</p></div></div>`; }).join("") : `<p class="muted">No sub-skill is below 67%. Look at the error patterns below for finer targets.</p>`;
  const tags = Object.entries(an.tags).filter(([, v]) => v.n >= 2).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  const tagRows = tags.map(([k, v]) => { const d = B.ERRTAGS[k] || { label: k, note: "" }; const qs = v.ids.map(id => "Q" + NUM[id]).join(", "); return `<tr><td><b>${esc(d.label)}</b><div class="small muted">${esc(d.note)}</div></td><td class="small">${esc([...v.src].join(", "))}${qs ? `<div class="muted">${qs}</div>` : ""}</td><td class="num">${v.n}</td></tr>`; }).join("");
  const subRows = OBJ_SKILLS.map(k => {
    const subs = Object.entries(an.sub).filter(([s]) => B.SUBS[s].skill === k);
    return `<tr><th colspan="5" style="padding-top:14px">${esc(B.SKILLS[k].name)}</th></tr>` + subs.map(([s, x]) => { const p = x.c / x.n; return `<tr><td>${esc(B.SUBS[s].name)}</td><td class="num">${x.c}/${x.n}</td><td style="width:32%"><div class="mini" title="${Math.round(p * 100)}% correct"><i style="width:${p * 100}%;background:var(--${band(p)})"></i></div></td><td class="num ${"cell-" + band(p)}">${Math.round(p * 100)}%</td><td class="num small muted" title="Confident errors / lucky guesses">${x.sureWrong || "·"} / ${x.unsureRight || "·"}</td></tr>`; }).join("");
  }).join("");
  const lvlRows = OBJ_SKILLS.map(k => `<tr><td>${esc(B.SKILLS[k].name)}</td>${LVLS.map(L => { const x = an.skill[k].lv[L]; if (!x) return `<td class="num muted">—</td>`; const p = x.c / x.n; return `<td class="num cell-${band(p)}" title="${Math.round(p * 100)}%">${x.c}/${x.n}</td>`; }).join("")}</tr>`).join("");
  const strengths = an.strengths.length ? an.strengths.map(s => `<span class="pill good">${esc(B.SUBS[s.sub].name)}</span>`).join(" ") : `<span class="muted small">None at 80%+ yet.</span>`;
  const times = B.PARTS.map(p => `${esc(p.title.replace(/^Part \d+: /, ""))} ${fmtTime((at.s1.time || {})[p.key])}`).join(" · ");
  return `<div class="sheet"><div class="headline"><div><span class="eyebrow">Overall profile</span><div class="bigl">${an.overall ? posLabel(an.overall) : "—"}</div></div>
    <div><h2>${esc(at.name)}</h2><p class="small muted">Started ${new Date(at.created).toLocaleString()} · Session 1 ${at.s1.done ? "finished" : "in progress (" + s1n + "/" + ITEMS.length + ")"} · Session 2 ${at.s2.done ? "submitted" : "not submitted"}</p>
    <div class="row" style="margin-top:8px"><button class="btn small" id="copyreport">Copy report as text</button><span class="small muted" id="copyrmsg"></span></div></div></div>
    <div class="profile" aria-label="CEFR profile by skill">${skillRows}<div class="scale"><span></span><div class="ticks"><span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span></div><span></span></div></div>
    <p class="small muted">Each bar ends at her estimated level. A level counts as reached at 60% or more of its items, together with every level below it. "+" means she's close to the next level. Writing and speaking fill in once you mark them.</p></div>
  ${insights.length ? `<div class="sheet"><span class="eyebrow">What stands out</span>${insights.map(i => `<p>${i}</p>`).join("")}</div>` : ""}
  <div class="sheet"><span class="eyebrow">Coach these first</span><div class="prio">${prio}</div><div class="row small"><span class="muted">Strengths:</span> ${strengths}</div></div>
  <div class="sheet"><span class="eyebrow">Error patterns</span><p class="small muted">Each wrong answer is tagged with the mistake it shows. Ticks from your writing and speaking marking count double.</p>
    <div class="tablewrap">${tagRows ? `<table><thead><tr><th>Pattern</th><th>Seen in</th><th class="num">Count</th></tr></thead><tbody>${tagRows}</tbody></table>` : `<p class="muted small">No repeated pattern yet.</p>`}</div></div>
  <div class="sheet"><span class="eyebrow">Sub-skills</span><div class="tablewrap"><table><thead><tr><th>Sub-skill</th><th class="num">Score</th><th></th><th class="num">%</th><th class="num" title="Confident errors / lucky guesses">Sure✗ / Unsure✓</th></tr></thead><tbody>${subRows}</tbody></table></div></div>
  <div class="sheet"><span class="eyebrow">Where it breaks down: correct answers by item level</span><div class="tablewrap"><table><thead><tr><th>Skill</th>${LVLS.map(L => `<th class="num">${L}</th>`).join("")}</tr></thead><tbody>${lvlRows}</tbody></table></div>
    <p class="small muted">Time per part: ${times}. Listening plays used: ${Object.keys(B.CLIPS).map((k, i) => `Clip ${i + 1} ${(at.s1.plays || {})[k] || 0}/2`).join(" · ")}.</p></div>`;
}

function itemsHTML(at, an) {
  return B.PARTS.map(P => `<div class="sheet"><span class="eyebrow">${esc(P.title)}</span><div class="tablewrap"><table class="review"><thead><tr><th class="num">#</th><th>Question</th><th>Her answer</th><th>Correct</th><th>Tag</th></tr></thead><tbody>
  ${an.items.filter(x => x.it.part === P.key).map(({ it, r, ok, tag, unsure }) => `<tr><td class="num">${NUM[it.id]}</td><td class="small">${esc((it.type === "err" ? it.s.replace(/\[([A-D]):([^\]]+)\]/g, "[$1 $2]") : it.q).slice(0, 110))} <span class="muted">${it.lvl}</span></td><td class="small ${ok ? "" : "wrong"}">${esc(respText(it, r))}${unsure ? ' <span class="pill warn">not sure</span>' : ""}</td><td class="small">${esc(ansText(it))}</td><td class="small muted">${tag ? esc((B.ERRTAGS[tag] || { label: tag === "UNANSWERED" ? "Blank" : tag }).label) : "✓"}</td></tr>`).join("")}
  </tbody></table></div>${P.key === "L" ? `<details><summary class="small">Transcripts</summary>${Object.values(B.CLIPS).map(c => `<div style="margin-bottom:12px"><b class="small">${esc(c.title)}</b>${c.lines.map(l => `<p class="small"><span class="muted">${esc(l.sp)}:</span> ${esc(l.text)}</p>`).join("")}</div>`).join("")}</details>` : ""}</div>`).join("");
}

function markHTML(at, k) {
  const m = at.marks[k];
  const rub = B.RUBRIC[k].map(c => { const v = m.scores[c.sub]; return `<div class="rubrow"><div class="row spread"><b>${esc(c.name)}</b><span class="small muted">${v != null ? esc(B.BANDS[v]) : "not marked"}</span></div>
    <div class="bands" role="group" aria-label="${esc(c.name)}">${c.d.map((d, i) => `<button class="band" data-score="${k}|${c.sub}|${i}" aria-pressed="${v === i}" title="${esc(d)}">${i} · ${B.BANDS[i]}</button>`).join("")}</div>
    <p class="small muted">${v != null ? esc(c.d[v]) : esc(c.d[3]) + " ← what B1 looks like"}</p></div>`; }).join("");
  const tags = `<div class="chips">${B.TEACHER_TAGS[k].map(t => `<button class="chip" data-tag="${k}|${t}" aria-pressed="${m.tags.includes(t)}" title="${esc(B.ERRTAGS[t].note)}">${esc(B.ERRTAGS[t].label)}</button>`).join("")}</div>`;
  let top = "";
  if (k === "W") {
    top = B.WRITING.map(w => { const t = (at.s2?.text || {})[w.id] || ""; return `<div class="sheet"><div class="row spread"><div><span class="eyebrow">${esc(w.title)} · target ${w.words} words</span></div><span class="small muted">${words(t)} words · ${fmtTime((at.s2?.time || {})[w.id])}</span></div>
      <p class="small muted">${esc(w.prompt)} The task asks her to: ${w.bullets.map(esc).join("; ")}. <i>Look for: ${esc(w.focus)}</i></p>
      <div class="essay">${t ? esc(t) : '<span class="muted">Nothing written yet.</span>'}</div></div>`; }).join("");
    if (caps.sample && ((at.s2?.text || {}).W1 || (at.s2?.text || {}).W2)) top += `<div class="sheet"><div class="row spread"><div><span class="eyebrow">Optional</span><h3>Get a second opinion from Claude</h3></div><button class="btn" id="aimark">Suggest marks</button></div><p class="small muted">Claude reads both texts against this rubric and suggests marks, error tags and corrected examples. You decide what to keep.</p><div id="aiout"></div></div>`;
  } else {
    top = `<div class="sheet"><span class="eyebrow">Speaking script · about 15 min</span><p class="small muted">Run this live (in person or on a call). Mark as you go, then adjust at the end.</p>
    ${B.SPEAKING.map(s => `<details ${s.id === "S1" ? "open" : ""}><summary>${esc(s.title)} <span class="muted small">· ${esc(s.time)} · ${esc(s.lvl)}</span></summary><p class="small"><i>Say:</i> “${esc(s.say)}”</p><ol class="small">${s.qs.map(q => `<li>${esc(q)}</li>`).join("")}</ol><p class="small muted">Listen for: ${esc(s.listen)}</p></details>`).join("")}</div>`;
  }
  return `${top}<div class="sheet"><span class="eyebrow">${k === "W" ? "Writing" : "Speaking"} rubric · 0–5 per criterion (3 = B1)</span><div class="rub">${rub}</div></div>
  <div class="sheet"><span class="eyebrow">Patterns you noticed (tick any that came up repeatedly)</span>${tags}
  <label class="small muted" for="notes-${k}">Notes for the coaching plan</label><textarea id="notes-${k}" data-notes="${k}" rows="4" placeholder="Examples of her errors, what to target first…">${esc(m.notes || "")}</textarea></div>`;
}

async function aiMark(at) {
  const out = $("#aiout"); out.innerHTML = `<p class="small muted">Reading her writing…</p>`;
  const rubric = B.RUBRIC.W.map(c => `${c.sub} ${c.name}: ${c.d.map((d, i) => i + "=" + d).join(" | ")}`).join("\n");
  const tagList = B.TEACHER_TAGS.W.map(t => `${t}: ${B.ERRTAGS[t].label}`).join("\n");
  const prompt = `You are an experienced CEFR/IELTS examiner marking a Vietnamese learner (estimated A2–B1) for her teacher. Be honest and precise; do not inflate.
Mark BOTH texts together on each criterion, 0–5, where 0=below A1, 1=A1, 2=A2, 3=B1, 4=B2, 5=C1+.
Rubric:\n${rubric}
Error tags (use only these keys; include a tag only if it appears more than once across the texts):\n${tagList}

TASK 1 (${B.WRITING[0].words} words): ${B.WRITING[0].prompt} Points: ${B.WRITING[0].bullets.join("; ")}.
TEXT 1:\n"""${(at.s2.text.W1 || "").slice(0, 3000)}"""

TASK 2 (${B.WRITING[1].words} words): ${B.WRITING[1].prompt} Points: ${B.WRITING[1].bullets.join("; ")}.
TEXT 2:\n"""${(at.s2.text.W2 || "").slice(0, 4000)}"""

Reply with JSON only: {"scores":{"W-TA":n,"W-CC":n,"W-LR":n,"W-GR":n,"W-RG":n},"tags":["KEY",...],"summary":"2-3 sentences for the teacher","examples":[{"original":"exact phrase from her text","corrected":"…","tag":"KEY"}]} with 3–6 examples.`;
  try {
    let res;
    try { res = await caps.sample.json(prompt, { modelTier: "default" }); }
    catch (e) { if (e && (e.code === "not_granted" || e.code === "rate_limited")) throw e; const t = await caps.sample(prompt, { modelTier: "default" }); res = JSON.parse((t.text.match(/\{[\s\S]*\}/) || ["{}"])[0]); }
    const sc = res.scores || {};
    out.innerHTML = `<div class="ai"><p>${esc(res.summary || "")}</p>
      <p class="small">${B.RUBRIC.W.map(c => `${esc(c.name)}: <b>${sc[c.sub] != null ? esc(B.BANDS[sc[c.sub]] || sc[c.sub]) : "—"}</b>`).join(" · ")}</p>
      ${(res.tags || []).length ? `<p class="small">Patterns: ${(res.tags || []).filter(t => B.ERRTAGS[t]).map(t => esc(B.ERRTAGS[t].label)).join(", ")}</p>` : ""}
      ${(res.examples || []).length ? `<table><thead><tr><th>She wrote</th><th>Better</th></tr></thead><tbody>${res.examples.map(x => `<tr><td class="small">${esc(x.original)}</td><td class="small">${esc(x.corrected)}</td></tr>`).join("")}</tbody></table>` : ""}
      <div class="row"><button class="btn small primary" id="aiapply">Apply these marks and tags</button><span class="small muted">You can change any of them after.</span></div></div>`;
    $("#aiapply").onclick = () => {
      const rec = getAttempt(sel); const a = rec.a;
      for (const c of B.RUBRIC.W) if (typeof sc[c.sub] === "number" && sc[c.sub] >= 0 && sc[c.sub] <= 5) a.marks.W.scores[c.sub] = Math.round(sc[c.sub]);
      a.marks.W.tags = [...new Set([...(a.marks.W.tags || []), ...(res.tags || []).filter(t => B.TEACHER_TAGS.W.includes(t))])];
      if (res.examples?.length && !a.marks.W.notes) a.marks.W.notes = res.examples.map(x => `${x.original} → ${x.corrected}`).join("\n");
      persistAttempt(a, rec.src); renderReport();
    };
  } catch (e) {
    if (e && e.code === "not_granted") { out.innerHTML = `<p class="small muted">Claude suggestions are turned off for this page.</p>`; return; }
    out.innerHTML = `<p class="small muted">Couldn't get suggestions${e && e.code === "rate_limited" ? " (too many requests, try again in a minute)" : ""}. You can mark with the rubric below.</p>`;
  }
}

function reportText(at) {
  const an = analyse(at); const L = [];
  L.push(`ENGLISH DIAGNOSTIC: ${at.name}`, `Overall profile: ${an.overall ? posLabel(an.overall) : "—"}`, "");
  for (const k of ["G", "V", "R", "L", "RW", "W", "S"]) { const e = an.skill[k].est; const sk = an.skill[k]; L.push(`${B.SKILLS[k].name}: ${e ? e.label : "not marked"}${sk.n ? ` (${sk.c}/${sk.n})` : ""}`); }
  L.push("", "COACH THESE FIRST");
  an.priorities.forEach((p, i) => L.push(`${i + 1}. ${B.SUBS[p.sub].name} (${p.detail}): ${B.SUBS[p.sub].fix}`));
  L.push("", "ERROR PATTERNS");
  Object.entries(an.tags).filter(([, v]) => v.n >= 2).sort((a, b) => b[1].n - a[1].n).slice(0, 8).forEach(([k, v]) => L.push(`- ${(B.ERRTAGS[k] || { label: k }).label} ×${v.n} (${[...v.src].join(", ")})`));
  L.push("", `Confident errors: ${an.sureWrong.length} · Lucky guesses: ${an.unsureRight.length} · Blank: ${an.unanswered}`);
  if (at.marks.W.notes) L.push("", "Writing notes:", at.marks.W.notes);
  if (at.marks.S.notes) L.push("", "Speaking notes:", at.marks.S.notes);
  return L.join("\n");
}
async function copyText(text, msgEl) {
  try { await navigator.clipboard.writeText(text); if (msgEl) msgEl.textContent = "Copied"; }
  catch { if (msgEl) msgEl.textContent = "Select the text and copy it manually."; }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const pt = e.target.closest("[data-part]"); if (pt && route() === "session-1") { const i = Number(pt.dataset.part); if (i >= 0 && i < B.PARTS.length) { stopAudio(); A.s1.part = i; save(); render(); window.scrollTo(0, 0); } return; }
  const pl = e.target.closest("[data-play]"); if (pl) { playClip(pl.dataset.play); return; }
  if (e.target.id === "newatt") { $("#newbox").innerHTML = `<span class="small">This clears the current attempt on this device.</span> <button class="btn small" id="newyes">Clear it</button> <button class="btn small ghost" data-go="home">Keep it</button>`; return; }
  if (e.target.id === "newyes") { if (A) { const lib = library(); lib[A.id] = A; setLibrary(lib); } A = null; store.del(K_CUR); dbStatus = "none"; render(); return; }
  if (e.target.id === "finish1") {
    const left = ITEMS.length - Object.keys(A.s1.ans).filter(k => A.s1.ans[k] !== "").length;
    if (left > 0 && !e.target.dataset.sure) { e.target.dataset.sure = "1"; e.target.textContent = "Finish anyway"; $("#finishbox").insertAdjacentHTML("afterbegin", `<span class="small muted">${left} question${left > 1 ? "s are" : " is"} still blank. Use the tabs to check.</span>`); return; }
    A.s1.done = true; A.s1.finished = new Date().toISOString(); save(); go("done-1"); return;
  }
  if (e.target.id === "finish2") {
    const w1 = words(A.s2.text.W1), w2 = words(A.s2.text.W2);
    if ((w1 < 50 || w2 < 80) && !e.target.dataset.sure) { e.target.dataset.sure = "1"; e.target.textContent = "Submit anyway"; $("#finishbox2").insertAdjacentHTML("afterbegin", `<span class="small muted">One of your texts is very short. </span>`); return; }
    A.s2.done = true; A.s2.finished = new Date().toISOString(); save(); go("done-2"); return;
  }
  if (e.target.id === "copycode") { const box = $("#codebox"); box.select(); copyText(box.value, $("#copymsg")); return; }
  if (e.target.id === "iamteacher") { teacherOK = true; store.set(K_TEACH, true); render(); return; }
  const si = e.target.closest("[data-sel]"); if (si) { sel = si.dataset.sel; renderTeacherList(); renderReport(); return; }
  const rt = e.target.closest("[data-rtab]"); if (rt) { reportTab = rt.dataset.rtab; renderReport(); return; }
  if (e.target.id === "doimport") { try { sel = importCode($("#importbox").value); $("#importbox").value = ""; $("#importmsg").textContent = "Imported"; renderTeacherList(); renderReport(); } catch { $("#importmsg").textContent = "That code didn't work. Check it was copied completely, starting with ELD1."; } return; }
  if (e.target.id === "copyreport") { const rec = getAttempt(sel); copyText(reportText(rec.a), $("#copyrmsg")); return; }
  if (e.target.id === "aimark") { const rec = getAttempt(sel); e.target.disabled = true; aiMark(rec.a).finally(() => { const b = $("#aimark"); if (b) b.disabled = false; }); return; }
  const sc = e.target.closest("[data-score]"); if (sc) { const [k, sub, v] = sc.dataset.score.split("|"); const rec = getAttempt(sel); const sv = Number(v); if (rec.a.marks[k].scores[sub] === sv) delete rec.a.marks[k].scores[sub]; else rec.a.marks[k].scores[sub] = sv; persistAttempt(rec.a, rec.src); renderReport(); return; }
  const tg = e.target.closest("[data-tag]"); if (tg) { const [k, t] = tg.dataset.tag.split("|"); const rec = getAttempt(sel); const arr = rec.a.marks[k].tags; const i = arr.indexOf(t); if (i >= 0) arr.splice(i, 1); else arr.push(t); persistAttempt(rec.a, rec.src); tg.setAttribute("aria-pressed", i < 0); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "radio" && route() === "session-1") { A.s1.ans[t.name] = Number(t.value); save(); refreshTabs(); return; }
  if (t.dataset.unsure) { if (t.checked) A.s1.unsure[t.dataset.unsure] = true; else delete A.s1.unsure[t.dataset.unsure]; save(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.gap) { A.s1.ans[t.dataset.gap] = t.value; save(); refreshTabs(); return; }
  if (t.dataset.write) { A.s2.text[t.dataset.write] = t.value; const wc = document.querySelector(`[data-wc="${t.dataset.write}"]`); if (wc) wc.textContent = words(t.value) + " words"; save(); return; }
  if (t.dataset.notes) { const rec = getAttempt(sel); rec.a.marks[t.dataset.notes].notes = t.value; persistAttempt(rec.a, rec.src); return; }
});
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.write) activeTask = e.target.dataset.write; });
document.addEventListener("paste", e => { if (e.target.dataset && e.target.dataset.write) { e.preventDefault(); } });
document.addEventListener("submit", e => {
  if (e.target.id === "startform") { e.preventDefault(); const nm = $("#nm").value.trim(); if (!nm) return; A = newAttempt(nm); save(); render(); }
});

render();
initCaps();
</script>
</body>
